<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grupo TCC Apariciofer</title>
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#6b2f33">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única centralizada estilo link-in-bio; paleta da Apariciofer (vinho, dourado, metal champanhe) */
:root {
  --bg: #f3ece4;
  --surface: #fffaf5;
  --fg: #3a1d1f;
  --muted: #7a5a55;
  --line: #dcc8b6;
  --steel: #6b2f33;
  --safety: #e8b52a;
  --on-steel: #fff4dc;
  --metal: linear-gradient(180deg, #f4ebe1 0%, #ead9c8 55%, #dcc4ac 100%);
  color-scheme: light;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.stripe {
  height: 10px;
  background: #6b2f33;
  border-bottom: 4px solid #e8b52a;
  box-sizing: content-box;
}
html { background: #dcc4ac; min-height: 100%; }
body { margin: 0; background: var(--metal); background-color: #dcc4ac; min-height: 100vh; min-height: 100dvh; }
.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding-block: 36px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 28px;
}
header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.badge {
  width: 76px; height: 76px; border-radius: 50%;
  background: var(--steel); color: var(--on-steel);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .04em;
  border: 4px solid var(--safety);
}
.eyebrow {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
}
h1 {
  margin: 0;
  font-family: var(--display); font-weight: 700;
  font-size: clamp(28px, 8vw, 36px); line-height: 1.05;
  text-wrap: balance; color: var(--steel);
}
.sub { margin: 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.facts {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px;
}
.fact {
  font-size: 13px; font-weight: 500;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--fg); background: var(--surface);
}
.fact b { font-variant-numeric: tabular-nums; }
h2 {
  margin: 0 0 -14px; font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .12em; color: var(--muted);
}
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.link {
  display: flex; align-items: center; gap: 14px;
  min-height: 64px; padding: 12px 16px;
  background: var(--surface); color: var(--fg); text-decoration: none;
  border: 1.5px solid var(--line); border-radius: 14px;
  transition: transform .15s ease, border-color .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.link:hover, .link:focus-visible { border-color: var(--steel); }
.link:active { transform: scale(.98); }
.link:focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }
.ini {
  flex: none; width: 48px; height: 48px; border-radius: 50%;
  background: var(--steel); color: var(--on-steel);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 18px;
  position: relative; overflow: hidden;
  box-shadow: 0 0 0 2px var(--safety);
}
.ini img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.who { flex: 1; min-width: 0; }
.name { display: block; font-weight: 600; font-size: 16px; line-height: 1.25; }
.role { display: block; font-size: 13px; color: var(--muted); }
.in {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--steel);
}
.in svg { width: 20px; height: 20px; fill: currentColor; }
.link.off { pointer-events: none; opacity: .6; border-style: dashed; }
.link.off .in { color: var(--muted); }
footer { text-align: center; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>
</head>

const lista = document.getElementById("lista");
integrantes.forEach(p => {
  const partes = p.nome.split(" ");
  const ini = (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "link" + (p.linkedin ? "" : " off");
  if (p.linkedin) { a.href = p.linkedin; a.target = "_blank"; a.rel = "noopener"; }

  if (p.foto) {
    const img = document.createElement("img");
    img.src = p.foto; img.alt = ""; img.loading = "lazy";
    img.onerror = () => img.remove();
    a.querySelector(".ini").appendChild(img);
  }
  li.appendChild(a);
