<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grupo TCC Apariciofer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única centralizada estilo link-in-bio; paleta da Apariciofer (vinho, dourado, metal champanhe) */
:root {
  --bg: #f3ece4;
  --surface: #fffaf5;
  --fg: #3a1d1f;
  --muted: #7a5a55;
  --line: #dcc8b6;
  --steel: #6b2f33;
  --safety: #e8b52a;
  --on-steel: #fff4dc;
  --metal: linear-gradient(135deg, #f1e6da 0%, #d8bfa6 45%, #f4e9de 60%, #c9a98a 100%);
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1112; --surface: #2a191b; --fg: #f4e9de; --muted: #c4a99c;
    --line: #4a2e30; --steel: #e8b52a; --safety: #e8b52a; --on-steel: #3a1d1f;
    --metal: linear-gradient(135deg, #3a2224 0%, #2a191b 50%, #43292a 100%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1112; --surface: #2a191b; --fg: #f4e9de; --muted: #c4a99c;
  --line: #4a2e30; --steel: #e8b52a; --safety: #e8b52a; --on-steel: #3a1d1f;
  --metal: linear-gradient(135deg, #3a2224 0%, #2a191b 50%, #43292a 100%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.stripe {
  height: 10px;
  background: #6b2f33;
  border-bottom: 4px solid #e8b52a;
  box-sizing: content-box;
}
html { background: var(--bg); }
body { background: var(--metal), var(--bg); min-height: 100vh; }
.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding-block: 36px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 28px;
}
header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.badge {
  width: 76px; height: 76px; border-radius: 50%;
  background: var(--steel); color: var(--on-steel);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .04em;
  border: 4px solid var(--safety);
}
.eyebrow {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
}
h1 {
  margin: 0;
  font-family: var(--display); font-weight: 700;
  font-size: clamp(28px, 8vw, 36px); line-height: 1.05;
  text-wrap: balance; color: var(--steel);
}
.sub { margin: 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.facts {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px;
}
.fact {
  font-size: 13px; font-weight: 500;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--fg); background: var(--surface);
}
.fact b { font-variant-numeric: tabular-nums; }
h2 {
  margin: 0 0 -14px; font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .12em; color: var(--muted);
}
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.link {
  display: flex; align-items: center; gap: 14px;
  min-height: 64px; padding: 12px 16px;
  background: var(--surface); color: var(--fg); text-decoration: none;
  border: 1.5px solid var(--line); border-radius: 14px;
  transition: transform .15s ease, border-color .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.link:hover, .link:focus-visible { border-color: var(--steel); }
.link:active { transform: scale(.98); }
.link:focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }
.ini {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  background: var(--steel); color: var(--on-steel);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 17px;
}
.who { flex: 1; min-width: 0; }
.name { display: block; font-weight: 600; font-size: 16px; line-height: 1.25; }
.role { display: block; font-size: 13px; color: var(--muted); }
.in {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--steel);
}
.in svg { width: 20px; height: 20px; fill: currentColor; }
.link.off { pointer-events: none; opacity: .6; border-style: dashed; }
.link.off .in { color: var(--muted); }
footer { text-align: center; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>
</head>
<body>

<div class="stripe" aria-hidden="true"></div>
<main class="wrap">
  <header>
    <p class="sub">Gostou do tema? Conecte com o grupo no LinkedIn e vamos continuar a conversa.</p>
  </header>

  <h2>Integrantes</h2>
  <ul id="lista"></ul>

  <footer>Feira de TCC · Instituto Mauá de Tecnologia · 2026</footer>
</main>

<script>
// Cole o link do LinkedIn de cada integrante entre as aspas
const integrantes = [
  { nome: "Carolina Caltabiano Verreschi", linkedin: "https://www.linkedin.com/in/carolina-caltabiano-verreschi" },
  { nome: "Enzo Domingues Ferreira",       linkedin: "https://www.linkedin.com/in/enzodominguesferreira" },
  { nome: "Jéssica Miwa Watanabe",         linkedin: "https://www.linkedin.com/in/jessicamwatanabe" },
  { nome: "Lara Tie Osawa Yasumoto",       linkedin: "https://www.linkedin.com/in/lara-yasumoto-841727209" },
  { nome: "Mariana Mendes Keller",         linkedin: "https://www.linkedin.com/in/marianamkeller" }
];
const icon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>';
const lista = document.getElementById("lista");
integrantes.forEach(p => {
  const partes = p.nome.split(" ");
  const ini = (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "link" + (p.linkedin ? "" : " off");
  if (p.linkedin) { a.href = p.linkedin; a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = '<span class="ini">' + ini + '</span>' +
    '<span class="who"><span class="name"></span><span class="role">Engenharia de Produção</span></span>' +
    '<span class="in">' + icon + (p.linkedin ? 'LinkedIn' : 'Em breve') + '</span>';
  a.querySelector(".name").textContent = p.nome;
  li.appendChild(a);
  lista.appendChild(li);
});
</script>

</body>
</html>
